<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>KuKirin G2</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>

<body>

<div class="bg"></div>

<div class="phone">

<header>

<div class="title">

KuKirin G2

</div>

<div id="bleStatus">

<div class="bleDot"></div>

<span>Disconnected</span>

</div>

</header>

<div class="speedCard">

<div class="ring">

<svg viewBox="0 0 340 340">

<circle

class="ringBg"

cx="170"

cy="170"

r="145"

/>

<circle

id="ring"

class="ringValue"

cx="170"

cy="170"

r="145"

/>

</svg>

<div class="center">

<div id="speed">

0

</div>

<div class="unit">

km/h

</div>

</div>

</div>

</div>

<div class="stats">

<div class="box">

<span class="material-icons">

battery_full

</span>

<div class="label">

Battery

</div>

<div id="battery">

100%

</div>

</div>

<div class="box">

<span class="material-icons">

bolt

</span>

<div class="label">

Voltage

</div>

<div id="voltage">

54.6V

</div>

</div>

<div class="box">

<span class="material-icons">

device_thermostat

</span>

<div class="label">

Temperature

</div>

<div id="temp">

28°C

</div>

</div>

<div class="box">

<span class="material-icons">

sports_motorsports

</span>

<div class="label">

Mode

</div>

<div id="mode">

SPORT

</div>

</div>

<div class="box">

<span class="material-icons">

route

</span>

<div class="label">

ODO

</div>

<div id="odo">

0 km

</div>

</div>

<div class="box">

<span class="material-icons">

timeline

</span>

<div class="label">

Trip

</div>

<div id="trip">

0 km

</div>

</div>

</div>

<div class="bottom">

<button id="connect">

<span class="material-icons">

bluetooth

</span>

Połącz z G2

</button>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
